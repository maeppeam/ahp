<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" id="metaDescription" data-i18n-content="meta.projectsDescription" content="All projects built by MAEP — 8 web apps born from real, everyday problems." />
<title>Projects - MAEP</title>
<link rel="icon" type="image/png" href="profile.png">
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<!-- ===== NAVBAR ===== -->
<header class="navbar">
<div class="nav-inner">
<a href="index.html#top" class="brand"><img src="logo.png" alt="MAEP" class="brand-logo"></a>
<nav class="nav-links">
<a href="index.html#top" data-i18n="nav.home">Home</a>
<a href="index.html#techstack" data-i18n="nav.techstack">Tech Stack</a>
<a href="projects.html" class="active" data-i18n="nav.projects">Projects</a>
<a href="about.html" data-i18n="nav.journey">Journey</a>
</nav>
<div class="nav-actions">
<button id="langToggle" class="lang-toggle" data-i18n-aria="lang.aria" aria-label="Switch language">EN</button>
<button id="darkModeToggle" class="dark-toggle" data-i18n-aria="theme.aria" aria-label="Toggle light/dark mode">🌙</button>
</div>
</div>
</header>

<!-- ===== PROJECTS (full) ===== -->
<section class="projects" id="projects" style="padding-top:56px">
<div class="section-head reveal">
<div>
<h2 class="section-title" data-i18n="projects.titleAll">All Projects</h2>
</div>
<div class="toolbar">
<input type="text" id="searchInput" data-i18n-placeholder="projects.search" placeholder="Search projects..." aria-label="Search projects">
<select id="sortSelect" aria-label="Sort projects">
<option value="newest" data-i18n="projects.sortNewest" selected>Newest</option>
<option value="oldest" data-i18n="projects.sortOldest">Oldest</option>
<option value="title">A-Z</option>
<option value="title-desc">Z-A</option>
</select>
</div>
</div>
<p class="projects-intro reveal" data-i18n="projects.introAll">Every application here — 8 in total — was built to solve a real, everyday problem.</p>
<div class="chips" id="chipBar"></div>
<div id="projectContainer" class="grid"></div>
<div class="grid-empty" id="emptyState" hidden>
<p data-i18n="projects.empty">😕 No matching projects.</p>
<button class="btn btn-ghost" data-i18n="projects.reset" onclick="resetAllFilters()">Reset Filter</button>
</div>
</section>

<!-- ===== FOOTER ===== -->
<footer class="footer">
<div class="footer-inner">
<span id="visitorCount"></span>
<span>© <span id="year"></span> MAEP</span>
<span id="lastUpdated"></span>
</div>
</footer>

<!-- ===== MODAL ===== -->
<div id="modal" class="modal" role="dialog" aria-modal="true">
<div class="modal-content">
<button class="modal-close" data-i18n-aria="modal.close" aria-label="Close">&times;</button>
<div id="modalBody"></div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="portfolio.js"></script>
</body>
</html>
