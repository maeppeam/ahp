<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portofolio GAS - AfterHours</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">⚡</div>
      <span>AfterHours</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-category="Semua">
        <span class="nav-icon">📊</span> <span>Dashboard</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">👨‍💻</div>
        <div>
          <div class="user-name">PEAM</div>
          <div class="user-role">Developer</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ===================== MAIN ===================== -->
  <main class="main-content">
    <!-- HEADER with Profile Photo -->
    <header class="top-header">
      <div class="header-left">
        <h1>Dashboard</h1>
        <p>Kelola dan pantau semua project Google Apps Script-mu</p>
      </div>
      <div class="header-right">
        <img src="assets/profile.png" alt="Profile" class="header-avatar" onerror="this.style.display='none'">
        <button id="darkModeToggle" class="dark-toggle">🌙</button>
      </div>
    </header>

    <!-- STATISTIK -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">📦</div>
        <div>
          <div class="stat-number" id="totalProjects">0</div>
          <div class="stat-label">Total Project</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🟢</div>
        <div>
          <div class="stat-number" id="liveProjects">0</div>
          <div class="stat-label">Live</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📅</div>
        <div>
          <div class="stat-number" id="latestProject">-</div>
          <div class="stat-label">Project Terbaru</div>
        </div>
      </div>
    </section>

    <!-- SEARCH & SORT -->
    <div class="filter-bar">
      <div class="filter-actions">
        <input type="text" id="searchInput" placeholder="🔍 Cari project...">
        <select id="sortSelect">
          <option value="default">📌 Default</option>
          <option value="title">🔤 A-Z</option>
          <option value="title-desc">🔤 Z-A</option>
          <option value="newest">🆕 Terbaru</option>
          <option value="oldest">📅 Terlama</option>
        </select>
      </div>
    </div>

    <!-- PROJECT GRID -->
    <section class="projects-section">
      <div class="section-header">
        <h2>📁 Semua Project</h2>
        <span id="projectCount">0 project</span>
      </div>
      <div id="projectContainer" class="project-grid">
        <div class="loading">⏳ Memuat project...</div>
      </div>
      <div id="pagination" class="pagination-container"></div>
    </section>

    <!-- FOOTER -->
    <footer class="main-footer">
      <span>🔄 Last updated: <span id="lastUpdated"></span></span>
    </footer>
  </main>

  <!-- MODAL -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="portfolio.js"></script>
</body>
</html>
